name: Build Android ARM64 drivers

on:
  workflow_dispatch:
    inputs:
      kernel:
        description: 内核版本（all 编译全部七个版本并生成完整安装脚本）
        type: choice
        default: all
        options:
          - all
          - 6.18-Android17
          - 6.12-Android16
          - 6.6-Android15
          - 6.1-Android14
          - 5.15-Android13
          - 5.10-Android13
          - 5.10-Android12
      strip:
        description: 剥离调试符号（6.6 / 6.12 / 6.18 始终保留）
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'lsdriver/**'
      - 'build_all.sh'
      - 'packer.sh'
      - 'install_driver.version'
      - '.github/scripts/**'
      - '.github/reference/**'
      - '.github/workflows/build-driver.yml'
  pull_request:
    paths:
      - 'lsdriver/**'
      - 'build_all.sh'
      - 'packer.sh'
      - 'install_driver.version'
      - '.github/scripts/**'
      - '.github/reference/**'
      - '.github/workflows/build-driver.yml'

permissions:
  contents: read

concurrency:
  group: build-driver-${{ github.workflow }}-${{ github.ref }}-${{ inputs.kernel || 'all' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Check build scripts
        run: |
          for script in build_all.sh packer.sh .github/scripts/*.sh; do
            bash -n "$script"
          done
          python3 -m py_compile .github/scripts/*.py
          python3 .github/scripts/test-build-environment.py
          python3 .github/scripts/test-kernel-matching.py
          python3 .github/scripts/test-client-lifecycle.py
      - name: Select kernels
        id: matrix
        env:
          SELECTED_KERNEL: ${{ inputs.kernel || 'all' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          kernels = [
              '6.18-Android17', '6.12-Android16', '6.6-Android15',
              '6.1-Android14', '5.15-Android13', '5.10-Android13', '5.10-Android12',
          ]
          selected = os.environ['SELECTED_KERNEL']
          if selected != 'all':
              if selected not in kernels:
                  raise SystemExit(f'Unsupported kernel: {selected}')
              kernels = [selected]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'kernel': kernels}) + '\n')
          PY

  build:
    name: ${{ matrix.kernel }}
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      KERNEL_VERSION: ${{ matrix.kernel }}
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts/${{ matrix.kernel }}
      STRIP_CHOICE: ${{ inputs.strip && 'y' || 'n' }}
    steps:
      - uses: actions/checkout@v4
      - name: Reserve memory and disk for the official kernel build
        run: |
          echo "KERNELS_ROOT=$RUNNER_TEMP/kernels" >> "$GITHUB_ENV"
          # These unused SDKs are on this disposable hosted runner only.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          # Full-LTO vmlinux links (especially Android 12/13) can exceed RAM.
          # Add capacity without changing LTO, CFI or any kernel configuration.
          sudo fallocate -l 24G "$RUNNER_TEMP/kernel-build.swap"
          sudo chmod 600 "$RUNNER_TEMP/kernel-build.swap"
          sudo mkswap "$RUNNER_TEMP/kernel-build.swap"
          sudo swapon "$RUNNER_TEMP/kernel-build.swap"
          free -h
          df -h "$RUNNER_TEMP"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc binutils-aarch64-linux-gnu bison build-essential ca-certificates \
            cpio curl flex git kmod libdw-dev libelf-dev libssl-dev libtinfo5 \
            lz4 pahole python3 python3-pyelftools rsync unzip xz-utils zlib1g-dev zstd
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com
      - name: Sync official sources and identify the exact environment
        id: environment
        run: |
          mkdir -p logs
          bash build_all.sh --cloud "$KERNEL_VERSION" sync 2>&1 | tee "logs/$KERNEL_VERSION-sync.log"
      - name: Restore the exact prepared kernel environment
        id: kernel-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/kernels/${{ matrix.kernel }}/module-environment-cache
          key: ${{ steps.environment.outputs.cache-key }}
      - name: Unpack the prepared environment
        if: steps.kernel-cache.outputs.cache-hit == 'true'
        run: bash .github/scripts/kernel-cache.sh restore
      - name: Build with the author's Bazel or Legacy environment
        run: |
          vmstat 30 > "logs/$KERNEL_VERSION-resources.log" &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; free -h; df -h "$RUNNER_TEMP"' EXIT
          /usr/bin/time -v -o "$ARTIFACT_DIR/build-resources.txt" \
            bash build_all.sh --cloud "$KERNEL_VERSION" build 2>&1 | tee "logs/$KERNEL_VERSION.log"
      - name: Finalize reusable kernel outputs
        run: |
          if [[ '${{ steps.kernel-cache.outputs.cache-hit }}' != true ]]; then
            bash .github/scripts/kernel-cache.sh save
            # Verify the cache independently of the original output tree.
            # Never save an environment that changes the resulting module.
            cp "$ARTIFACT_DIR/$KERNEL_VERSION.ko" "$RUNNER_TEMP/module-before-cache.ko"
            mv "$KERNELS_ROOT/$KERNEL_VERSION/out" "$KERNELS_ROOT/$KERNEL_VERSION/out-before-cache-check"
            if [[ "$KERNEL_VERSION" == 5.10-Android12 ]]; then
              mv "$KERNELS_ROOT/$KERNEL_VERSION/build/build-tools" "$KERNELS_ROOT/$KERNEL_VERSION/build/build-tools-before-cache-check"
            fi
            bash .github/scripts/kernel-cache.sh restore
            bash build_all.sh --cloud "$KERNEL_VERSION" build 2>&1 | tee "logs/$KERNEL_VERSION-cache-check.log"
            cmp "$RUNNER_TEMP/module-before-cache.ko" "$ARTIFACT_DIR/$KERNEL_VERSION.ko"
            echo 'Cache reconstruction produced a byte-identical driver.'
          fi
          {
            echo "### $KERNEL_VERSION"
            echo "Prepared environment cache hit: ${{ steps.kernel-cache.outputs.cache-hit == 'true' }}"
            du -h "$KERNELS_ROOT/$KERNEL_VERSION/module-environment-cache/environment.tar.zst"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Cache successful kernel preparation
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/kernels/${{ matrix.kernel }}/module-environment-cache
          key: ${{ steps.environment.outputs.cache-key }}
      - name: Upload driver
        uses: actions/upload-artifact@v4
        with:
          name: driver-${{ matrix.kernel }}
          path: artifacts/${{ matrix.kernel }}/
          if-no-files-found: error
          retention-days: 30
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.kernel }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload environment and ABI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.kernel }}
          path: |
            artifacts/${{ matrix.kernel }}/*.txt
            artifacts/${{ matrix.kernel }}/*.json
            artifacts/${{ matrix.kernel }}/*.xml
            artifacts/${{ matrix.kernel }}/*.config
            artifacts/${{ matrix.kernel }}/*.symvers
            artifacts/${{ matrix.kernel }}/*.mod.c
            artifacts/${{ matrix.kernel }}/*.tar.gz
          if-no-files-found: ignore
          retention-days: 30

  package:
    name: Package drivers
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: driver-*
          path: downloaded
      - name: Package only this run's modules
        env:
          BUILD_MATRIX: ${{ needs.prepare.outputs.matrix }}
        run: |
          mkdir -p release/modules release/build-info
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import shutil
          versions = json.loads(os.environ['BUILD_MATRIX'])['kernel']
          for version in versions:
              source = pathlib.Path('downloaded') / ('driver-' + version)
              module = source / (version + '.ko')
              if not module.is_file() or module.stat().st_size == 0:
                  raise SystemExit(f'Missing module: {version}')
              shutil.copy2(module, 'lsdriver')
              shutil.copy2(module, 'release/modules')
              shutil.copytree(source, pathlib.Path('release/build-info') / version,
                              ignore=shutil.ignore_patterns('*.ko'))
          pathlib.Path('release/built-kernels.txt').write_text('\n'.join(versions) + '\n')
          PY
          # packer.sh embeds only modules built above. A single-version run produces
          # an installer for that version; an all run produces the complete installer.
          bash packer.sh
          bash -n install_driver.sh
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import re
          payloads = {
              '6.18-Android17': 'payload_6_18', '6.12-Android16': 'payload_6_12',
              '6.6-Android15': 'payload_6_6', '6.1-Android14': 'payload_6_1',
              '5.15-Android13': 'payload_5_15', '5.10-Android13': 'payload_android13',
              '5.10-Android12': 'payload_android12',
          }
          installer = pathlib.Path('install_driver.sh').read_text()
          for version in json.loads(os.environ['BUILD_MATRIX'])['kernel']:
              pattern = rf"{payloads[version]}\(\) \{{\ncat << 'B64EOF'\n(.*?)\nB64EOF"
              match = re.search(pattern, installer, re.S)
              if not match:
                  raise SystemExit(f'Installer is missing {version}')
              embedded = base64.b64decode(''.join(match[1].splitlines()), validate=True)
              module = (pathlib.Path('release/modules') / (version + '.ko')).read_bytes()
              if embedded != module:
                  raise SystemExit(f'Installer payload mismatch: {version}')
              print(f'Verified installer payload: {version}')
          PY
          cp install_driver.sh release/
          bash install_driver.sh --version > release/package-version.txt
          (cd release && sha256sum install_driver.sh modules/*.ko > SHA256SUMS)
          {
            echo '### 云编译完成'
            echo '下载 lsdriver-package，其中包含安装脚本、模块、构建信息和 SHA256 校验值。'
            echo '本次安装脚本包含以下版本：'
            cat release/built-kernels.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: lsdriver-package
          path: release/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish app driver downloads
    needs: package
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (inputs.kernel == '' || inputs.kernel == 'all')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lsdriver-package
          path: release
      - name: Create verified manifest and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          DRIVER_TAG: drivers-${{ github.run_id }}
        run: |
          python3 .github/scripts/release-manifest.py
          gh release create "$DRIVER_TAG" release/modules/*.ko release/driver-manifest.json \
            release/SHA256SUMS release/install_driver.sh \
            --target "$GITHUB_SHA" --title "lsdriver $DRIVER_TAG" \
            --notes-file release/release-notes.md --latest
